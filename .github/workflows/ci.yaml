name: CI
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set environment variable
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          SHORT_SHA_COMMIT=$(git rev-parse --short HEAD)
          echo CONTAINER_RELEASE_IMAGE=ghcr.io/tentou-tech/wow-yourself:${GITHUB_REF_NAME//\//-}_${SHORT_SHA_COMMIT} >> $GITHUB_ENV
          cp ".env.${TARGET_BRANCH}" .env
      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.CONTAINER_RELEASE_IMAGE }}
  updategitops:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
      - name: Set environment variable
        run: |
          SHORT_SHA_COMMIT=$(git rev-parse --short HEAD)
          echo CONTAINER_RELEASE_IMAGE=ghcr.io/tentou-tech/wow-yourself:${GITHUB_REF_NAME//\//-}_${SHORT_SHA_COMMIT} >> $GITHUB_ENV
      - name: Update GitOps repo
        run: |
          git clone https://${{ secrets.REGISTRY_PASSWORD }}@github.com/tentou-tech/gitops.git
          cd gitops/clusters/k8s-${GITHUB_REF_NAME}/punkga

          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh"  | bash
          ./kustomize edit set image image_wow_yourself=${{ env.CONTAINER_RELEASE_IMAGE }}
          rm kustomize

          git config user.name "ci-bot"
          git config user.email "ci@bot"
          git commit -am "Update images to ${GITHUB_SHA::8}"

          git push

